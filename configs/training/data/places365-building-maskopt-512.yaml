# @package _group_

batch_size: 2
val_batch_size: 1
num_workers: 4

train:
  indir: ${location.data_root_dir}/train
  out_size: 512
  mask_generator_kind: weighted
  mask_gen_kwargs:
    variants:
      - proba: 0.15
        kind: irregular
        kwargs:
          min_times: 8
          max_times: 60
          max_width: 20
          max_angle: 4
          max_len: 120
      - proba: 0.30
        kind: irregular
        kwargs:
          min_times: 4
          max_times: 10
          max_width: 100
          max_angle: 4
          max_len: 220
      - proba: 0.45
        kind: irregular
        kwargs:
          min_times: 1
          max_times: 5
          max_width: 250
          max_angle: 4
          max_len: 450
      - proba: 0.10
        kind: box
        kwargs:
          margin: 10
          bbox_min_size: 80
          bbox_max_size: 300
          max_times: 3
          min_times: 1
  transform_variant: distortions
  dataloader_kwargs:
    batch_size: ${data.batch_size}
    shuffle: True
    num_workers: ${data.num_workers}

val:
  kind: online
  indir: ${location.data_root_dir}/val
  out_size: 512
  img_suffix: .jpg
  mask_generator_kind: weighted
  mask_gen_kwargs: ${data.train.mask_gen_kwargs}
  transform_variant: no_augs
  dataloader_kwargs:
    batch_size: ${data.val_batch_size}
    shuffle: False
    num_workers: ${data.num_workers}

visual_test:
  kind: online
  indir: ${location.data_root_dir}/test
  out_size: 512
  img_suffix: .jpg
  pad_out_to_modulo: 32
  mask_generator_kind: weighted
  mask_gen_kwargs: ${data.train.mask_gen_kwargs}
  transform_variant: no_augs
  dataloader_kwargs:
    batch_size: 1
    shuffle: False
    num_workers: ${data.num_workers}
